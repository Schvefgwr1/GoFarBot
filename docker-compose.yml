version: '3.9'
services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gofar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: dlh1763GsdJGHasdT135!
      MINIO_ROOT_PASSWORD: hghjhjfhdf46t45t4HFGhjfj3R56bdff5!
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - backend-network

  springapp:
    build: .
    container_name: springapp
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gofar
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: dlh1763GsdJGHasdT135!
      MINIO_ROOT_PASSWORD: hghjhjfhdf46t45t4HFGhjfj3R56bdff5!
      TG_BOT_NAME: goFarBot_test-development-version
      TG_BOT_TOKEN: 7365748376:AAHTagw_pBibRMuUmEsI_drRzvyFp3a0eKU
    depends_on:
      - postgres
      - minio
    networks:
      - backend-network

volumes:
  postgres-data:
  minio-data:

networks:
  backend-network:
