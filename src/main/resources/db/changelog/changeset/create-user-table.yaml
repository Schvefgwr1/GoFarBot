databaseChangeLog:
  - changeSet:
      id: 7
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValue: NOW()
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValue: NOW()
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: state
            constraintName: fk_user_messages
            referencedTableName: messages
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE