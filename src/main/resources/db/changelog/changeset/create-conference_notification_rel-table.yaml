databaseChangeLog:
  - changeSet:
      id: 16
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: conferences_notifications_rel
            columns:
              - column:
                  name: conference
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: notification
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: conferences_notifications_rel
            baseColumnNames: conference
            constraintName: fk_conferences_notifications_rel
            referencedTableName: conferences
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: conferences_notifications_rel
            baseColumnNames: notification
            constraintName: fk_notifications_conferences_rel
            referencedTableName: notifications
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE