databaseChangeLog:
  - changeSet:
      id: 3
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: links
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: links
            baseColumnNames: type
            constraintName: fk_links_types_link
            referencedTableName: types_link
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE