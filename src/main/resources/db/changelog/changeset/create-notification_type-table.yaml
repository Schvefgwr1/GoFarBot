databaseChangeLog:
  - changeSet:
      id: 14
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: notification_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false