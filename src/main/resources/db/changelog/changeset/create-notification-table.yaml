databaseChangeLog:
  - changeSet:
      id: 14
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: conferences_messages_rel
            columns:
              - column:
                  name: conference
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: conferences_messages_rel
            baseColumnNames: conference
            constraintName: fk_conferences_messages_rel
            referencedTableName: conferences
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: conferences_messages_rel
            baseColumnNames: message
            constraintName: fk_messages_conferences_rel
            referencedTableName: messages
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE