databaseChangeLog:
  - changeSet:
      id: 15
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: text
                  type: VARCHAR(5000)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: file
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: file
            constraintName: fk_notifications_files
            referencedTableName: files
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: type
            constraintName: fk_notifications_types_rel
            referencedTableName: notification_types
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE