databaseChangeLog:
  - changeSet:
      id: 35
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: links_metric
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: link_name
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValue: NOW()
      rollback:
        - dropTable:
            tableName: links_metric