databaseChangeLog:
  - changeSet:
      id: 6
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: messages_links_rel
            columns:
              - column:
                  name: message
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: link
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: messages_links_rel
            baseColumnNames: message
            constraintName: fk_messages_links_rel
            referencedTableName: messages
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: messages_links_rel
            baseColumnNames: link
            constraintName: fk_links_messages_rel
            referencedTableName: links
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE