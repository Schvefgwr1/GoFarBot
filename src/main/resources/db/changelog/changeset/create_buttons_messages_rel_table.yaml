databaseChangeLog:
  - changeSet:
      id: 27
      author: vsevolod schetov
      changes:
        - createTable:
            tableName: buttons_messages_rel
            columns:
              - column:
                  name: button_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: buttons_messages_rel
            baseColumnNames: button_id
            constraintName: fk_buttons_messages_rel
            referencedTableName: buttons
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: buttons_messages_rel
            baseColumnNames: message_id
            constraintName: fk_messages_buttons_rel
            referencedTableName: messages
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE